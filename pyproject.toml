[project]
name = "dsm5-rag-system"
version = "1.0.0"
description = "DSM-5 Psychological Analysis System using RAG"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "langchain==0.1.4",
    "langchain-openai==0.0.5",
    "langchain-community==0.0.16",
    "langchain-experimental==0.0.49",
    "chromadb==0.4.22",
    "pypdf==4.0.1",
    "tiktoken==0.5.2",
    "openai==1.10.0",
    "streamlit==1.30.0",
    "requests==2.31.0",
    "python-multipart==0.0.6",
    "aiofiles==23.2.1",
    "loguru==0.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []