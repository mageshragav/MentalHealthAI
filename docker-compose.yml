version: '3.8'

services:
  backend:
    build: .
    container_name: dsm5-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - PYTHONPATH=/app
    restart: unless-stopped

  frontend:
    build: .
    container_name: dsm5-frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    volumes:
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
      - PYTHONPATH=/app
    command: streamlit run frontend/app.py --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped

  ingest:
    build: .
    container_name: dsm5-ingest
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    # Using -u to ensure output is not buffered
    command: python -u scripts/ingest.py
    profiles:
      - ingest
    stdin_open: true # allows interactive input for the reset prompt
    tty: true
