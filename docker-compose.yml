version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dsm5-backend
    ports:
      - "8000:8000"
    volumes:
      # Vector database persistence
      - ./backend/data/chroma_db:/app/backend/data/chroma_db
      # Logs persistence
      - ./backend/logs:/app/backend/logs
    env_file:
      - backend/.env
    environment:
      # API Configuration
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      API_RELOAD: "false"  # Disable reload in production

      # Python Configuration
      PYTHONPATH: "/app"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

      # ChromaDB Configuration
      CHROMA_TELEMETRY_DISABLED: "true"

      # Log Configuration
      LOG_LEVEL: "INFO"
      LOG_FILE: "/app/backend/logs/app.log"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - dsm5-network


  # Document Ingestion Service (Optional)
  # Use with: docker-compose run --rm ingest
  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dsm5-ingest
    volumes:
      # Full app access for ingestion
      - .:/app
    env_file:
      - backend/.env
    environment:
      # Python Configuration
      PYTHONPATH: "/app"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

      # ChromaDB Configuration
      CHROMA_TELEMETRY_DISABLED: "true"

      # Log Configuration
      LOG_LEVEL: "INFO"
    command:
      - "python"
      - "-u"
      - "backend/scripts/ingest.py"
    profiles:
      - ingest
    stdin_open: true  # Allow interactive input for reset prompt
    tty: true
    networks:
      - dsm5-network

networks:
  dsm5-network:
    driver: bridge
