version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dsm5-backend
    ports:
      - "8000:8000"
    volumes:
      # Vector database persistence
      - ./backend/data/chroma_db:/app/backend/data/chroma_db
      # Logs persistence
      - ./backend/logs:/app/backend/logs
    env_file:
      - backend/.env
    environment:
      # API Configuration
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      API_RELOAD: "false"  # Disable reload in production

      # Python Configuration
      PYTHONPATH: "/app"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

      # ChromaDB Configuration
      CHROMA_TELEMETRY_DISABLED: "true"

      # Log Configuration
      LOG_LEVEL: "INFO"
      LOG_FILE: "/app/backend/logs/app.log"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - dsm5-network

  # Frontend Web UI Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dsm5-frontend
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # Logs persistence
      - ./backend/logs:/app/backend/logs
      # Streamlit cache (optional)
      - ~/.streamlit:/root/.streamlit
    env_file:
      - backend/.env
    environment:
      # Backend Configuration
      BACKEND_URL: "http://backend:8000"

      # Python Configuration
      PYTHONPATH: "/app"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

      # Streamlit Configuration
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_CLIENT_SHOWERRORDETAILS: "true"
    command:
      - "streamlit"
      - "run"
      - "frontend/app.py"
      - "--server.port=8501"
      - "--server.address=0.0.0.0"
    restart: unless-stopped
    networks:
      - dsm5-network

  # Document Ingestion Service (Optional)
  # Use with: docker-compose run --rm ingest
  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dsm5-ingest
    volumes:
      # Full app access for ingestion
      - .:/app
    env_file:
      - backend/.env
    environment:
      # Python Configuration
      PYTHONPATH: "/app"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

      # ChromaDB Configuration
      CHROMA_TELEMETRY_DISABLED: "true"

      # Log Configuration
      LOG_LEVEL: "INFO"
    command:
      - "python"
      - "-u"
      - "backend/scripts/ingest.py"
    profiles:
      - ingest
    stdin_open: true  # Allow interactive input for reset prompt
    tty: true
    networks:
      - dsm5-network

networks:
  dsm5-network:
    driver: bridge
